name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed:
        description: 使用签名 Secrets 额外导出已签名 IPA
        type: boolean
        default: false
      export_method:
        description: 签名导出方式（Ad Hoc 选择 release-testing）
        type: choice
        options: [release-testing, debugging, app-store-connect]
        default: release-testing

permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Tool versions
        run: |
          node --version
          xcodebuild -version
          swift --version
      - name: Install locked dependencies
        run: npm ci
      - name: Frontend unit tests and TypeScript build
        run: |
          npm test
          npm run build
      - name: Native timing and lifecycle tests
        run: |
          mkdir -p build/logs
          set -o pipefail
          swift test --package-path native-core 2>&1 | tee build/logs/native-tests.log
      - name: Generate iOS project and register Swift plugin
        run: node scripts/prepare-ios.mjs
      - name: Build unsigned device app and IPA
        run: python3 -X utf8 -u scripts/build_ios.py
      - name: Export signed IPA (optional)
        if: ${{ inputs.signed }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: python3 -X utf8 -u scripts/build_ios.py --signed --method '${{ inputs.export_method }}'
      - name: Upload app and IPA
        if: ${{ !cancelled() && hashFiles('artifacts/*.ipa') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AppleNetworkProbe-iOS-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-logs-${{ github.run_number }}
          path: |
            build/logs/
            ios/App/CapApp-SPM/Package.swift
            ios/App/App/capacitor.config.json
          retention-days: 7
          if-no-files-found: warn
